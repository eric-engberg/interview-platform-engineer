services:
  embeddings:
    build:
      context: ./embeddings
      dockerfile: Dockerfile
    image: embeddings:local
    pull_policy: build
    container_name: embeddings
    ports:
      - "8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
