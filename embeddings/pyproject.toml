[project]
name = "embeddings"
version = "0.1.0"
description = "REST API that converts text into vector embeddings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.133.0",
    "sentence-transformers>=5.2.3",
    # torch is a transitive dependency of sentence-transformers. Pinning it
    # as a direct dep so we can route it to the PyTorch CPU index below,
    # which cuts ~800MB of CUDA libraries out of the image. uv only honors
    # [tool.uv.sources] for direct deps.
    "torch>=2.0",
    "uvicorn>=0.41.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
